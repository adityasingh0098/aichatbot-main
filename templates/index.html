<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            padding: 18px 25px;
            border-bottom: 1px solid #ddd;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 75%;
            padding: 13px 17px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot .bubble {
            background: #f0f0f0;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .empty {
            text-align: center;
            margin-top: 25vh;
            color: #777;
        }

        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .input-area input:focus {
            border-color: #2563eb;
        }

        .send-button {
            padding: 0 22px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .clear-button {
            margin: 10px 20px;
            padding: 9px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        .clear-button:hover {
            background: #f0f0f0;
        }

        @media (max-width: 600px) {
            .bubble {
                max-width: 90%;
            }

            .chat-area {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        🤖 AI Chatbot
    </div>

    <div class="chat-area" id="chatArea">

        {% if messages %}

            {% for message in messages %}

                {% if message.role == "user" %}

                    <div class="message user">
                        <div class="bubble">
                            {{ message.content }}
                        </div>
                    </div>

                {% else %}

                    <div class="message bot">
                        <div class="bubble">
                            {{ message.content }}
                        </div>
                    </div>

                {% endif %}

            {% endfor %}

        {% else %}

            <div class="empty">
                <h2>👋 Hello!</h2>
                <p>I'm your AI assistant. How can I help you?</p>
            </div>

        {% endif %}

    </div>

    <form class="input-area" method="POST" action="/chat">

        <input
            type="text"
            name="message"
            placeholder="Message your AI assistant..."
            autocomplete="off"
            required
        >

        <button class="send-button" type="submit">
            Send
        </button>

    </form>

    <a href="/clear">
        <button class="clear-button" type="button">
            🗑️ New Chat
        </button>
    </a>

</div>

<script>
    // Automatically scroll to the newest message
    const chatArea = document.getElementById("chatArea");
    chatArea.scrollTop = chatArea.scrollHeight;

    // Focus the message box automatically
    document.querySelector('input[name="message"]').focus();
</script>

</body>
</html>
